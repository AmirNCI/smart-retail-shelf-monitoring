<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Retail Shelf Monitoring</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-raised: #ffffff;
    --page:           #f4f5f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --blue-450:       #2a78d6;
    --blue-550:       #1c5cab;
    --blue-200:       #9ec5f4;
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
    /* categorical identity colors, fixed order, from the validated palette */
    --cat-dairy:      #2a78d6;  /* blue */
    --cat-frozen:     #1baf7a;  /* aqua */
    --cat-bakery:     #eb6834;  /* orange */
    --cat-produce:    #008300;  /* green */
    --cat-beverages:  #4a3aa7;  /* violet */
    --shadow-sm: 0 1px 2px rgba(11,11,11,0.05), 0 1px 1px rgba(11,11,11,0.04);
    --shadow-md: 0 4px 14px rgba(11,11,11,0.08), 0 1px 2px rgba(11,11,11,0.06);
    --shadow-lg: 0 12px 28px rgba(11,11,11,0.12), 0 2px 6px rgba(11,11,11,0.08);
    --hero-grad: linear-gradient(120deg, #1c5cab 0%, #2a78d6 45%, #1baf7a 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-raised: #222221;
      --page:           #0a0a0b;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --blue-450:       #3987e5;
      --blue-550:       #184f95;
      --blue-200:       #184f95;
      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-serious:  #ec835a;
      --status-critical: #e66767;
      --cat-dairy:      #3987e5;
      --cat-frozen:     #199e70;
      --cat-bakery:     #d95926;
      --cat-produce:    #1fb31f;
      --cat-beverages:  #9085e9;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
      --shadow-lg: 0 12px 28px rgba(0,0,0,0.5);
      --hero-grad: linear-gradient(120deg, #104281 0%, #184f95 45%, #199e70 100%);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1320px; margin: 0 auto; padding: 0 20px 64px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    align-items: start;
    gap: 24px;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .side-col { position: static !important; }
  }
  .side-col {
    position: sticky;
    top: 20px;
  }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
    margin: 20px 0 24px;
    padding: 26px 28px;
    border-radius: 18px;
    background: var(--hero-grad);
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 85% -20%, rgba(255,255,255,0.20), transparent 60%);
    pointer-events: none;
  }
  .brand { display: flex; align-items: center; gap: 14px; position: relative; min-width: 0; }
  .brand-text { min-width: 0; }
  .brand-icon {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px;
    background: rgba(255,255,255,0.18);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  .brand-icon svg { width: 24px; height: 24px; }
  h1 { font-size: 22px; margin: 0; color: #ffffff; letter-spacing: -0.01em; }
  .subtitle { color: rgba(255,255,255,0.82); font-size: 13px; margin-top: 3px; }

  .live-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: #ffffff;
    border: 1px solid rgba(255,255,255,0.30); border-radius: 999px;
    padding: 4px 10px 4px 8px;
    background: rgba(255,255,255,0.14);
    position: relative;
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ee24e;
    box-shadow: 0 0 0 0 rgba(78,226,78,0.6);
    animation: pulse-dot 2s infinite;
  }
  .live-pill.stale .live-dot { background: #ff8b8b; animation: none; box-shadow: none; }
  .live-pill.stale { color: #ffd7d7; }
  @keyframes pulse-dot {
    0%   { box-shadow: 0 0 0 0 rgba(78,226,78,0.55); }
    70%  { box-shadow: 0 0 0 6px rgba(78,226,78,0); }
    100% { box-shadow: 0 0 0 0 rgba(78,226,78,0); }
  }

  /* ---- KPI summary row ---- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 26px;
  }
  .kpi-tile {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; gap: 14px;
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .kpi-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .kpi-icon {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--blue-450) 14%, transparent);
  }
  .kpi-icon svg { width: 20px; height: 20px; stroke: var(--blue-450); }
  .kpi-tile.alert .kpi-icon { background: color-mix(in srgb, var(--status-critical) 16%, transparent); }
  .kpi-tile.alert .kpi-icon svg { stroke: var(--status-critical); }
  .kpi-tile.ok .kpi-icon { background: color-mix(in srgb, var(--status-good) 16%, transparent); }
  .kpi-tile.ok .kpi-icon svg { stroke: var(--status-good); }
  .kpi-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .kpi-tile.alert .kpi-value { color: var(--status-critical); }

  section { margin-bottom: 28px; }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); margin: 0 0 10px;
  }

  /* ---- controls bar ---- */
  .controls-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .control-input, .control-select {
    font: inherit; font-size: 13px; color: var(--text-primary);
    background: var(--surface-raised); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .control-input:focus, .control-select:focus {
    outline: none; border-color: var(--blue-450);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue-450) 20%, transparent);
  }
  .control-input { flex: 1 1 200px; min-width: 140px; }
  .control-input::placeholder { color: var(--text-muted); }
  .control-checkbox {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-secondary); white-space: nowrap;
    cursor: pointer;
  }
  .control-checkbox input { accent-color: var(--blue-450); }
  .result-count { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

  /* ---- category sections ---- */
  .category-section { margin-bottom: 22px; }
  .category-section:last-child { margin-bottom: 0; }
  .category-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .category-dot {
    width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
  }
  .category-head .category-name {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
  }
  .category-head .category-count {
    font-size: 12px; color: var(--text-muted);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 0 8px;
  }

  /* ---- alerts (sidebar) ---- */
  .alerts-head {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;
  }
  .alerts-head h2 { margin: 0; }
  .alerts-count {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 8px;
  }
  #alerts-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
    padding-right: 2px;
  }
  .alert-row {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-left: 3px solid var(--text-muted);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .alert-row:hover { box-shadow: var(--shadow-md); transform: translateX(-1px); }
  .alert-row.warning  { border-left-color: var(--status-warning); }
  .alert-row.serious  { border-left-color: var(--status-serious); }
  .alert-row.critical { border-left-color: var(--status-critical); }
  .alert-row-top {
    display: flex; align-items: center; gap: 8px;
  }
  .alert-shape { flex: 0 0 auto; width: 12px; height: 12px; }
  .alert-shape.warning {
    background: var(--status-warning);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  }
  .alert-shape.serious {
    background: var(--status-serious);
    transform: rotate(45deg);
  }
  .alert-shape.critical {
    background: var(--status-critical);
    border-radius: 3px;
  }
  .alert-shelf { font-weight: 600; flex: 1 1 auto; }
  .alert-detail { color: var(--text-secondary); font-size: 12px; margin: 4px 0 0 20px; }
  .alert-severity {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em;
    font-weight: 600;
  }
  .alert-severity.warning  { color: #9a6b00; }
  .alert-severity.serious  { color: #b8461f; }
  .alert-severity.critical { color: var(--status-critical); }
  @media (prefers-color-scheme: dark) {
    .alert-severity.warning  { color: var(--status-warning); }
    .alert-severity.serious  { color: var(--status-serious); }
  }
  .empty-state {
    color: var(--text-secondary); font-size: 14px;
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 16px; background: var(--surface-raised);
  }

  /* ---- shelf cards ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-top: 3px solid var(--card-accent, var(--blue-450));
    border-radius: 14px;
    padding: 16px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .card.has-alert {
    box-shadow: var(--shadow-md), 0 0 0 1px var(--status-critical);
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 12px;
  }
  .card-head .shelf-name { font-weight: 700; font-size: 15px; }
  .card-head .updated { font-size: 11px; color: var(--text-muted); }

  .meter-label {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;
  }
  .meter-label .value { font-weight: 700; color: var(--text-primary); }
  .meter-track {
    height: 9px; border-radius: 5px; background: var(--blue-200);
    overflow: hidden; margin-bottom: 14px;
  }
  .meter-fill {
    height: 100%; background: linear-gradient(90deg, var(--blue-550), var(--blue-450));
    border-radius: 5px;
    transition: width 0.4s ease;
  }
  .meter-fill.low  { background: linear-gradient(90deg, #9a6b00, var(--status-warning)); }
  .meter-fill.critical { background: linear-gradient(90deg, #a12e2e, var(--status-critical)); }

  .stat-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px;
  }
  .stat-tile .label {
    font-size: 11px; color: var(--text-muted); margin-bottom: 2px;
  }
  .stat-tile .value {
    font-size: 18px; font-weight: 700;
  }
  .stat-tile .value.warn { color: var(--status-critical); }

  .door-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; margin-top: 12px; color: var(--text-secondary);
    padding-top: 12px; border-top: 1px solid var(--gridline);
  }
  .door-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--status-good); }
  .door-badge.open .door-dot { background: var(--status-warning); }
  .door-badge.open-long .door-dot { background: var(--status-critical); }
  .door-badge.open-long { color: var(--status-critical); font-weight: 600; }

  #view-toggle {
    font: inherit; font-size: 12px; font-weight: 600; color: #ffffff;
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.30);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
    transition: background 0.15s ease;
  }
  #view-toggle:hover { background: rgba(255,255,255,0.26); }

  table.data-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    background: var(--surface-raised); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  table.data-table tbody tr:hover { background: color-mix(in srgb, var(--blue-450) 6%, transparent); }
  table.data-table th, table.data-table td {
    text-align: left; padding: 8px 12px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }
  table.data-table th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  table.data-table tr:last-child td { border-bottom: none; }

  .hidden { display: none; }

  /* ---- small-screen overrides (placed last so they win the cascade) ---- */
  @media (max-width: 600px) {
    header.top {
      flex-direction: column;
      align-items: flex-start;
      padding: 20px;
      margin-top: 16px;
    }
    .brand { display: block; width: 100%; }
    .brand-icon { margin-bottom: 10px; }
    h1 { font-size: 18px; max-width: calc(100vw - 80px); overflow-wrap: break-word; }
    .subtitle { font-size: 12px; max-width: calc(100vw - 80px); overflow-wrap: break-word; }
    .kpi-row { grid-template-columns: 1fr; }
  }
  body {
    overflow-x: hidden;
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h18l-1.5 12.5a1 1 0 0 1-1 .9H5.5a1 1 0 0 1-1-.9L3 7Z"/>
          <path d="M8 7V5a4 4 0 0 1 8 0v2"/>
          <path d="M8 11h8"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Smart Retail Shelf Monitoring</h1>
        <div class="subtitle">Live stock levels &amp; active alerts, polled from the fog/AWS pipeline</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; position:relative;">
      <span id="live-pill" class="live-pill"><span class="live-dot"></span><span id="live-text">Connecting…</span></span>
      <button id="view-toggle" type="button">Table view</button>
    </div>
  </header>

  <div id="kpi-row" class="kpi-row"></div>

  <div class="layout">
    <div class="main-col">
      <section>
        <h2>Shelves</h2>
        <div class="controls-bar">
          <input id="search-input" class="control-input" type="search" placeholder="Search by shelf or product…">
          <label class="control-checkbox"><input id="alerts-only" type="checkbox"> Alerts only</label>
          <select id="sort-select" class="control-select">
            <option value="name">Sort: Name (A–Z)</option>
            <option value="stock-asc">Sort: Stock (low to high)</option>
            <option value="stock-desc">Sort: Stock (high to low)</option>
          </select>
          <span id="result-count" class="result-count"></span>
        </div>
        <div id="shelves-sections"></div>
        <div id="shelves-table-wrap" class="hidden"></div>
        <div id="shelves-empty" class="empty-state hidden">No shelf data yet — waiting for the fog node's next batch dispatch.</div>
        <div id="shelves-no-match" class="empty-state hidden">No shelves match the current search/filter.</div>
      </section>
    </div>

    <aside class="side-col">
      <section>
        <div class="alerts-head">
          <h2>Active alerts</h2>
          <span id="alerts-count" class="alerts-count hidden">0</span>
        </div>
        <div id="alerts-list"></div>
        <div id="alerts-empty" class="empty-state hidden">No active alerts.</div>
      </section>
    </aside>
  </div>
</main>

<script>
// Update this if the API Gateway endpoint changes (see backend/template.yaml Outputs.StatusUrl).
const STATUS_URL = "https://ophlzcfz8l.execute-api.us-east-1.amazonaws.com/prod/status";
const POLL_INTERVAL_MS = 5000;
const STALE_AFTER_MS = 15000; // no successful poll in this window -> show "reconnecting"

// door_max_open_sec is uniform across every shelf that has a fridge door in
// config.json (see fog.door_max_open_sec / each fridge_door sensor's
// max_open_sec) so a single client-side constant is safe here. Per-shelf
// restock/temp/humidity thresholds, by contrast, now genuinely differ by
// category (fog_node.py enforces those server-side) and aren't needed
// client-side since the dashboard only displays the values, it doesn't alert.
const DOOR_MAX_OPEN_SEC = 20;

// Meter scale per shelf, mirroring each shelf_weight sensor's
// initial_weight_kg in config.json. Unlisted shelves fall back to DEFAULT.
const SHELF_MAX_KG = {
  "dairy-milk": 18, "dairy-yogurt": 10, "dairy-cheese": 8, "dairy-butter": 6,
  "frozen-icecream": 12, "frozen-vegetables": 15,
  "bakery-bread": 5,
  "produce-apples": 20, "produce-bananas": 18,
  "beverages-soda": 25,
};
const DEFAULT_MAX_KG = 20;

const CATEGORY_LABELS = {
  dairy: "Dairy", frozen: "Frozen", bakery: "Bakery",
  produce: "Produce", beverages: "Beverages",
};
const CATEGORY_ORDER = ["dairy", "frozen", "bakery", "produce", "beverages"];
// Fixed identity color per category, matching the --cat-* custom properties.
const CATEGORY_COLOR_VAR = {
  dairy: "--cat-dairy", frozen: "--cat-frozen", bakery: "--cat-bakery",
  produce: "--cat-produce", beverages: "--cat-beverages",
};
const DEFAULT_CATEGORY_COLOR_VAR = "--blue-450";

function categoryOf(shelfName) {
  return (shelfName.split("-")[0] || "other").toLowerCase();
}
function categoryLabel(category) {
  return CATEGORY_LABELS[category] || (category.charAt(0).toUpperCase() + category.slice(1));
}
function categoryColorVar(category) {
  return CATEGORY_COLOR_VAR[category] || DEFAULT_CATEGORY_COLOR_VAR;
}
// Card headers sit inside a category section already (e.g. "Dairy"), so
// drop the redundant "dairy-" prefix there and show just the product name.
function productNameOf(shelfName) {
  const rest = shelfName.split("-").slice(1).join(" ");
  const label = rest || shelfName;
  return label.charAt(0).toUpperCase() + label.slice(1);
}

const SEVERITY_BY_ALERT_TYPE = {
  restock_needed: "warning",
  door_open_too_long: "serious",
  temperature_out_of_range: "critical",
  humidity_out_of_range: "critical",
};

const liveDot = document.getElementById("live-pill");
const liveText = document.getElementById("live-text");
const alertsList = document.getElementById("alerts-list");
const alertsEmpty = document.getElementById("alerts-empty");
const alertsCount = document.getElementById("alerts-count");
const kpiRow = document.getElementById("kpi-row");
const shelvesSections = document.getElementById("shelves-sections");
const shelvesTableWrap = document.getElementById("shelves-table-wrap");
const shelvesEmpty = document.getElementById("shelves-empty");
const shelvesNoMatch = document.getElementById("shelves-no-match");
const viewToggle = document.getElementById("view-toggle");
const searchInput = document.getElementById("search-input");
const alertsOnlyCheckbox = document.getElementById("alerts-only");
const sortSelect = document.getElementById("sort-select");
const resultCount = document.getElementById("result-count");

let tableView = false;
let lastSuccessAt = 0;
let lastShelves = [];
let lastAlerts = [];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function timeAgo(isoString) {
  if (!isoString) return "unknown";
  const then = new Date(isoString).getTime();
  if (Number.isNaN(then)) return "unknown";
  const seconds = Math.max(0, Math.round((Date.now() - then) / 1000));
  if (seconds < 5) return "just now";
  if (seconds < 60) return `${seconds}s ago`;
  return `${Math.round(seconds / 60)}m ago`;
}

function alertDetailText(alert) {
  const d = alert.detail || {};
  switch (alert.alert_type) {
    case "restock_needed":
      return `${d.weight_kg ?? "?"} kg remaining`;
    case "door_open_too_long":
      return `open ${d.open_duration_sec ?? "?"}s`;
    case "temperature_out_of_range":
      return `${d.temperature_c ?? "?"}°C`;
    case "humidity_out_of_range":
      return `${d.humidity_pct ?? "?"}%`;
    default:
      return "";
  }
}

function renderAlerts(alerts) {
  if (!alerts.length) {
    alertsList.innerHTML = "";
    alertsEmpty.classList.remove("hidden");
    alertsCount.classList.add("hidden");
    return;
  }
  alertsEmpty.classList.add("hidden");
  alertsCount.classList.remove("hidden");
  alertsCount.textContent = alerts.length;
  alertsList.innerHTML = alerts.map((a) => {
    const severity = SEVERITY_BY_ALERT_TYPE[a.alert_type] || "warning";
    return `
      <div class="alert-row">
        <div class="alert-row-top">
          <span class="alert-shape ${severity}"></span>
          <span class="alert-shelf">${escapeHtml(a.shelf)}</span>
          <span class="alert-severity ${severity}">${severity}</span>
        </div>
        <div class="alert-detail">${escapeHtml(a.alert_type.replace(/_/g, " "))} — ${escapeHtml(alertDetailText(a))}</div>
      </div>`;
  }).join("");
}

function shelfHasAlert(shelfName, alerts) {
  return alerts.some((a) => a.shelf === shelfName);
}

const KPI_ICONS = {
  shelves: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  alert: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  trend: '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/>',
  tag: '<path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L3 3v6.59a2 2 0 0 0 .59 1.41l9.58 9.58a2 2 0 0 0 2.83 0l6.59-6.59a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
};

function kpiTile(icon, label, value, variant) {
  return `
    <div class="kpi-tile ${variant || ""}">
      <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${KPI_ICONS[icon]}</svg></span>
      <div>
        <div class="kpi-label">${escapeHtml(label)}</div>
        <div class="kpi-value">${escapeHtml(String(value))}</div>
      </div>
    </div>`;
}

function renderKpis(shelves, alerts) {
  if (!shelves.length) {
    kpiRow.innerHTML = "";
    return;
  }
  const avgPct = Math.round(
    shelves.reduce((sum, s) => {
      const maxKg = SHELF_MAX_KG[s.shelf] ?? DEFAULT_MAX_KG;
      return sum + Math.max(0, Math.min(100, ((s.weight_kg ?? 0) / maxKg) * 100));
    }, 0) / shelves.length
  );
  const categoryCount = new Set(shelves.map((s) => categoryOf(s.shelf))).size;

  kpiRow.innerHTML = [
    kpiTile("shelves", "Shelves tracked", shelves.length),
    kpiTile("alert", "Active alerts", alerts.length, alerts.length ? "alert" : "ok"),
    kpiTile("trend", "Avg stock level", `${avgPct}%`),
    kpiTile("tag", "Categories", categoryCount),
  ].join("");
}

function renderShelfCard(shelf, alerts) {
  const weight = shelf.weight_kg ?? 0;
  const maxKg = SHELF_MAX_KG[shelf.shelf] ?? DEFAULT_MAX_KG;
  const pct = Math.max(0, Math.min(100, (weight / maxKg) * 100));
  const meterClass = pct < 15 ? "critical" : (pct < 35 ? "low" : "");
  const hasDoor = shelf.door_open !== undefined;
  const doorOpen = !!shelf.door_open;
  const doorSec = shelf.door_open_sec ?? 0;
  const doorLong = doorOpen && doorSec >= DOOR_MAX_OPEN_SEC;
  const doorClass = doorLong ? "open-long" : (doorOpen ? "open" : "");
  const doorLabel = doorOpen ? `Door open ${doorSec}s` : "Door closed";
  const hasAlert = shelfHasAlert(shelf.shelf, alerts);
  const accentVar = categoryColorVar(categoryOf(shelf.shelf));

  return `
    <div class="card ${hasAlert ? "has-alert" : ""}" style="--card-accent:var(${accentVar})">
      <div class="card-head">
        <span class="shelf-name" title="${escapeHtml(shelf.shelf)}">${escapeHtml(productNameOf(shelf.shelf))}</span>
        <span class="updated">${escapeHtml(timeAgo(shelf.last_updated))}</span>
      </div>
      <div class="meter-label">
        <span>Stock</span>
        <span class="value">${weight} kg</span>
      </div>
      <div class="meter-track"><div class="meter-fill ${meterClass}" style="width:${pct}%"></div></div>
      <div class="stat-row">
        <div class="stat-tile">
          <div class="label">Foot traffic</div>
          <div class="value">${shelf.people_count ?? "—"}</div>
        </div>
        <div class="stat-tile">
          <div class="label">Temp (°C)</div>
          <div class="value">${shelf.temperature_c ?? "—"}</div>
        </div>
        ${shelf.humidity_pct !== undefined ? `
        <div class="stat-tile">
          <div class="label">Humidity (%)</div>
          <div class="value">${shelf.humidity_pct}</div>
        </div>` : ""}
      </div>
      ${hasDoor ? `<div class="door-badge ${doorClass}"><span class="door-dot"></span>${escapeHtml(doorLabel)}</div>` : ""}
    </div>`;
}

function renderShelvesTable(shelves) {
  if (!shelves.length) {
    shelvesTableWrap.innerHTML = "";
    return;
  }
  const rows = shelves.map((s) => `
    <tr>
      <td>${escapeHtml(s.shelf)}</td>
      <td>${escapeHtml(categoryLabel(categoryOf(s.shelf)))}</td>
      <td>${s.weight_kg ?? "—"}</td>
      <td>${s.people_count ?? "—"}</td>
      <td>${s.temperature_c ?? "—"}</td>
      <td>${s.humidity_pct ?? "—"}</td>
      <td>${s.door_open !== undefined ? (s.door_open ? `open ${s.door_open_sec ?? 0}s` : "closed") : "—"}</td>
      <td>${escapeHtml(timeAgo(s.last_updated))}</td>
    </tr>`).join("");
  shelvesTableWrap.innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Shelf</th><th>Category</th><th>Stock (kg)</th><th>Foot traffic</th>
        <th>Temp (°C)</th><th>Humidity (%)</th><th>Door</th><th>Updated</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function applyFilterAndSort(shelves, alerts) {
  const query = searchInput.value.trim().toLowerCase();
  const alertsOnly = alertsOnlyCheckbox.checked;

  let filtered = shelves.filter((s) => {
    if (query && !s.shelf.toLowerCase().includes(query)) return false;
    if (alertsOnly && !shelfHasAlert(s.shelf, alerts)) return false;
    return true;
  });

  const sortMode = sortSelect.value;
  filtered = [...filtered].sort((a, b) => {
    if (sortMode === "stock-asc") return (a.weight_kg ?? 0) - (b.weight_kg ?? 0);
    if (sortMode === "stock-desc") return (b.weight_kg ?? 0) - (a.weight_kg ?? 0);
    return a.shelf.localeCompare(b.shelf);
  });

  return filtered;
}

function renderShelves(shelves, alerts) {
  if (!shelves.length) {
    shelvesSections.innerHTML = "";
    shelvesTableWrap.innerHTML = "";
    shelvesEmpty.classList.remove("hidden");
    shelvesNoMatch.classList.add("hidden");
    resultCount.textContent = "";
    return;
  }
  shelvesEmpty.classList.add("hidden");

  const visible = applyFilterAndSort(shelves, alerts);
  resultCount.textContent = `${visible.length} of ${shelves.length} shelves`;

  if (!visible.length) {
    shelvesSections.innerHTML = "";
    shelvesTableWrap.innerHTML = "";
    shelvesNoMatch.classList.remove("hidden");
    return;
  }
  shelvesNoMatch.classList.add("hidden");

  // Group into category sections, preserving each section's internal sort order.
  const byCategory = new Map();
  for (const s of visible) {
    const cat = categoryOf(s.shelf);
    if (!byCategory.has(cat)) byCategory.set(cat, []);
    byCategory.get(cat).push(s);
  }
  const orderedCats = [
    ...CATEGORY_ORDER.filter((c) => byCategory.has(c)),
    ...[...byCategory.keys()].filter((c) => !CATEGORY_ORDER.includes(c)).sort(),
  ];

  shelvesSections.innerHTML = orderedCats.map((cat) => {
    const items = byCategory.get(cat);
    return `
      <section class="category-section">
        <div class="category-head">
          <span class="category-dot" style="background:var(${categoryColorVar(cat)})"></span>
          <span class="category-name">${escapeHtml(categoryLabel(cat))}</span>
          <span class="category-count">${items.length}</span>
        </div>
        <div class="grid">${items.map((s) => renderShelfCard(s, alerts)).join("")}</div>
      </section>`;
  }).join("");

  renderShelvesTable(visible);
}

function applyView() {
  shelvesSections.classList.toggle("hidden", tableView);
  shelvesTableWrap.classList.toggle("hidden", !tableView);
  viewToggle.textContent = tableView ? "Card view" : "Table view";
}

viewToggle.addEventListener("click", () => {
  tableView = !tableView;
  applyView();
});

function rerenderShelves() {
  renderShelves(lastShelves, lastAlerts);
}
searchInput.addEventListener("input", rerenderShelves);
alertsOnlyCheckbox.addEventListener("change", rerenderShelves);
sortSelect.addEventListener("change", rerenderShelves);

function setLiveState(ok) {
  liveDot.classList.toggle("stale", !ok);
  liveText.textContent = ok ? "Live" : "Reconnecting…";
}

async function poll() {
  try {
    const res = await fetch(STATUS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    lastSuccessAt = Date.now();
    setLiveState(true);
    lastShelves = data.shelves || [];
    lastAlerts = data.alerts || [];
    renderKpis(lastShelves, lastAlerts);
    renderAlerts(lastAlerts);
    renderShelves(lastShelves, lastAlerts);
  } catch (err) {
    console.error("poll failed:", err);
  } finally {
    setLiveState(Date.now() - lastSuccessAt < STALE_AFTER_MS);
  }
}

applyView();
poll();
setInterval(poll, POLL_INTERVAL_MS);
</script>
